modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL="https://github.com/sdf123098/Fox-Model-Loader/issues"
logoFile="foxmodelloader.png"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Fox Model Loader: Revival"
#updateJSONURL=""
displayURL="https://github.com/sdf123098/Fox-Model-Loader"
logoFile="foxmodelloader.png"
credits=""
authors="Micaftic"
description='''
Fox Model Loader: Revival - Custom player model system for Minecraft.
'''

[[mixins]]
config = "foxmodelloader.mixins.json"

[[mixins]]
config = "foxmodelloader_neoforge.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "touhou_little_maid"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "slashblade"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
